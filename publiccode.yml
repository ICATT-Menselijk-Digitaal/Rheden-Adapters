description:
  en:
    localisedName: "Rheden Adapters"
    shortDescription: Standalone adapters that sync external data sources (a
      Products and Services catalog, Microsoft Entra ID, Rx.Enterprise) into
      the Open Object register for KISS.
    longDescription: >-
      Rheden Adapters is a collection of standalone adapters, developed for
      the municipality Rheden, that sync external data sources into the Open
      Object register so it's directly available in KISS
      (https://www.kiss-klantcontact.nl/).


      It bundles the OpenPdc adapter (fetches products from a WordPress-based
      "Products and Services catalog" and syncs them as SDG Kennisartikelen
      into Open Objects), the Smoelenboek adapter (syncs employee data from
      Microsoft Entra ID into Open Objects as Medewerker objects), and the
      Rx.Enterprise adapter (retrieves Zaken information from Rx.Enterprise
      for KISS/ITA).
    documentation: https://github.com/ICATT-Menselijk-Digitaal/Rheden-Adapters
    features:
      - Makes JSON/HTTPS API calls
